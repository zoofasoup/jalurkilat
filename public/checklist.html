<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JalurKilat - Single Source of Truth Progress</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="p-4 sm:p-8 max-w-6xl mx-auto text-slate-800">

  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-6 mb-6 border-b border-slate-200 gap-4">
    <div>
      <div class="flex items-center gap-2 mb-1">
        <span class="w-7 h-7 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-xs">⚡</span>
        <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-tight">JalurKilat • Single Source of Truth</h1>
      </div>
      <p class="text-xs sm:text-sm text-slate-500">Go-Live Ready Checklist & Task Execution Pipeline</p>
    </div>

    <!-- Quick Stats & Actions -->
    <div class="flex items-center gap-2">
      <a href="/" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition">
        ← Kembali ke WebApp
      </a>
      <a href="/JalurKilat_Go_Live_Checklist.xlsx" download class="px-3 py-1.5 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 text-xs font-bold transition flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
        <span>Download .xlsx</span>
      </a>
    </div>
  </div>

  <!-- Progress Bar Summary -->
  <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-xs mb-6 grid grid-cols-2 sm:grid-cols-4 gap-4 text-center">
    <div>
      <p class="text-[10px] font-bold text-slate-400 uppercase">Total Tasks</p>
      <p class="text-xl font-extrabold text-slate-900" id="stat-total">17</p>
    </div>
    <div>
      <p class="text-[10px] font-bold text-emerald-600 uppercase">Done</p>
      <p class="text-xl font-extrabold text-emerald-700" id="stat-done">0</p>
    </div>
    <div>
      <p class="text-[10px] font-bold text-blue-600 uppercase">In Progress</p>
      <p class="text-xl font-extrabold text-blue-700" id="stat-progress">1</p>
    </div>
    <div>
      <p class="text-[10px] font-bold text-amber-600 uppercase">P0 (Wajib)</p>
      <p class="text-xl font-extrabold text-amber-700" id="stat-p0">9</p>
    </div>
  </div>

  <!-- Table Container -->
  <div class="bg-white rounded-3xl border border-slate-200/80 shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left text-xs" id="checklist-table">
        <thead class="bg-indigo-600 text-white font-bold text-[11px] uppercase tracking-wider">
          <tr>
            <th class="py-3 px-4">ID</th>
            <th class="py-3 px-4">Kategori</th>
            <th class="py-3 px-4">Item Pekerjaan</th>
            <th class="py-3 px-4 text-center">Status</th>
            <th class="py-3 px-4 text-center">Prioritas</th>
            <th class="py-3 px-4">Deliverable</th>
            <th class="py-3 px-4">Catatan Progress</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100 text-slate-700 font-medium" id="checklist-body">
          <!-- Populated via JS reading CSV -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadChecklist() {
      try {
        const res = await fetch('/JalurKilat_Go_Live_Checklist.csv');
        const text = await res.text();
        const lines = text.trim().split('\n');
        const headers = lines[0].split(',');

        const tbody = document.getElementById('checklist-body');
        tbody.innerHTML = '';

        let doneCount = 0;
        let progCount = 0;
        let p0Count = 0;

        for (let i = 1; i < lines.length; i++) {
          if (!lines[i].trim()) continue;
          
          // Simple CSV parser for quoted strings
          const regex = /(?:,|\n|^)("(?:(?:"")*[^"]*)*"|[^",\n]*|(?:\n|$))/g;
          const matches = [];
          let match;
          while ((match = regex.exec(lines[i])) !== null) {
            let val = match[1] || '';
            if (val.startsWith('"') && val.endsWith('"')) val = val.slice(1, -1).replace(/""/g, '"');
            matches.push(val);
            if (regex.lastIndex >= lines[i].length) break;
          }

          const [id, cat, title, status, priority, deliverable, notes] = matches;

          if (status === 'Done') doneCount++;
          if (status === 'In Progress') progCount++;
          if (priority && priority.includes('P0')) p0Count++;

          const tr = document.createElement('tr');
          tr.className = "hover:bg-slate-50/80 transition-colors";

          let statusBadge = `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-500">Pending</span>`;
          if (status === 'Done') {
            statusBadge = `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-200">Done</span>`;
          } else if (status === 'In Progress') {
            statusBadge = `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-blue-100 text-blue-800 border border-blue-200 animate-pulse">In Progress</span>`;
          }

          let priorityBadge = `<span class="text-[10px] font-medium text-slate-400">P2</span>`;
          if (priority && priority.includes('P0')) {
            priorityBadge = `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-50 text-rose-700 border border-rose-100">P0 Wajib</span>`;
          } else if (priority && priority.includes('P1')) {
            priorityBadge = `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-50 text-amber-700 border border-amber-100">P1 Tinggi</span>`;
          }

          tr.innerHTML = `
            <td class="py-3 px-4 font-mono font-bold text-slate-900">${id}</td>
            <td class="py-3 px-4 text-slate-500">${cat}</td>
            <td class="py-3 px-4 font-bold text-slate-900">${title}</td>
            <td class="py-3 px-4 text-center">${statusBadge}</td>
            <td class="py-3 px-4 text-center">${priorityBadge}</td>
            <td class="py-3 px-4 text-[11px] text-slate-600 max-w-xs">${deliverable}</td>
            <td class="py-3 px-4 text-[11px] font-mono text-indigo-700">${notes || '-'}</td>
          `;
          tbody.appendChild(tr);
        }

        document.getElementById('stat-total').innerText = lines.length - 1;
        document.getElementById('stat-done').innerText = doneCount;
        document.getElementById('stat-progress').innerText = progCount;
        document.getElementById('stat-p0').innerText = p0Count;

      } catch (err) {
        console.error("Gagal load CSV checklist:", err);
      }
    }

    loadChecklist();
  </script>
</body>
</html>
