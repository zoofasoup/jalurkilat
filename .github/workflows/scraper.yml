name: JalurKilat Radar Scraper Cron

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Job Radar Scraper
        run: |
          python scraper/scraper.py

      - name: Commit and Push Updated Jobs Data
        run: |
          git config --global user.name "JalurKilat Bot"
          git config --global user.email "bot@jalurkilat.id"
          git add public/data/jobs.json
          if git diff --staged --quiet; then
            echo "No new jobs detected in this cycle."
          else
            git commit -m "chore(radar): automated refresh of jobs feed [skip ci]"
            git push origin main
          fi
